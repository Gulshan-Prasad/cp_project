<head>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<h1>Edit Expense</h1>
<a href="/">Back to Home</a>

<form action="{{ url_for('edit_expense', id=expense.id) }}" method="POST">
    <label for="title">Title:</label>
    <input type="text" name="title" value="{{ expense.title }}" required>

    <label for="amount">Amount:</label>
    <input type="text" name="amount" value="{{ expense.amount }}" required>

    <label for="date">Date:</label>
    <input type="date" name="date" value="{{ expense.date }}" required>

    <label for="category">Category:</label>
    <input type="text" name="category" value="{{ expense.category }}">

    <label for="description">Description:</label>
    <textarea name="description">{{ expense.description }}</textarea>

    <button type="submit">Update Expense</button>
</form>
